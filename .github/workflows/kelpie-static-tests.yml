name: Kelpie OS V3 static application tests

on:
  push:
    branches:
      - v3-development
  pull_request:
    branches:
      - v3-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V3 development
        uses: actions/checkout@v4
        with:
          ref: v3-development

      - name: Validate Python application syntax
        run: |
          python3 -m py_compile \
            debian-live/config/includes.chroot/usr/lib/kelpie/kelpie-monitor.py \
            debian-live/config/includes.chroot/usr/lib/kelpie/kelpie-update.py \
            debian-live/config/includes.chroot/usr/lib/kelpie/kelpie-tweaks.py \
            debian-live/config/includes.chroot/usr/lib/kelpie/kelpie-disk.py

      - name: Validate shell scripts
        run: |
          bash -n debian-live/preflight.sh
          bash -n debian-live/validate-packages.sh
          bash -n debian-live/validate-iso.sh
          bash -n debian-live/build-in-container.sh
          sh -n debian-live/config/hooks/normal/0200-kelpie-branding.hook.chroot
          sh -n debian-live/config/hooks/normal/0300-kelpie-dconf.hook.chroot

      - name: Run Kelpie utility unit tests
        run: PYTHONPATH=debian-live/config/includes.chroot/usr/lib/kelpie python3 -m unittest discover -s debian-live/tests -v

      - name: Validate Calamares sequence against Debian Trixie
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 debian-live/validate-calamares.py

      - name: Validate Kelpie AppStream metadata
        run: python3 debian-live/validate-appstream.py

      - name: Validate official wallpaper asset
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("debian-live/assets/kelpie-constellation.svg")
          root = ET.parse(path).getroot()
          assert root.attrib.get("viewBox") == "0 0 1920 1080", "wallpaper must be 16:9 at 1920x1080 viewBox"
          assert root.tag.endswith("svg"), "wallpaper must be SVG"
          print("Official Kelpie constellation wallpaper: valid SVG, 16:9.")
          PY

      - name: Validate GNOME extension metadata
        run: |
          python3 -m json.tool \
            debian-live/config/includes.chroot/usr/share/gnome-shell/extensions/kelpie-menu@kelpieos.local/metadata.json \
            > /dev/null
