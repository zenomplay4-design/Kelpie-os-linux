name: Build Kelpie OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'debian-live/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

concurrency:
  group: kelpie-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/powershell || true
          df -h

      - name: Build ISO inside Debian Trixie
        run: |
          mkdir -p dist
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}/debian-live:/src:ro" \
            -v "${GITHUB_WORKSPACE}/dist:/out" \
            debian:trixie bash /src/build-in-container.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: kelpie-os-linux-debian13-amd64
          path: |
            dist/kelpie-os-linux-debian13-amd64.iso
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
