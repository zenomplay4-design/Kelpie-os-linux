name: Build Kelpie OS Linux V3 ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kelpie-os-v3-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout V3 development branch
        uses: actions/checkout@v4
        with:
          ref: v3-development

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/powershell || true
          df -h

      - name: Build ISO inside Debian Trixie
        run: |
          mkdir -p dist
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}/debian-live:/src:ro" \
            -v "${GITHUB_WORKSPACE}/dist:/out" \
            debian:trixie bash /src/build-in-container.sh

      - name: Upload candidate ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: kelpie-os-linux-v3-candidate-amd64
          path: |
            dist/kelpie-os-linux-v3-amd64.iso
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
