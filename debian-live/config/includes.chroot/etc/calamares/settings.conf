# Kelpie OS Linux V3 — Calamares configuration for Debian 13 Trixie
---
# "local" loads modules from the installed Calamares package and their
# configuration from /usr/share/calamares/modules or /etc/calamares/modules.
modules-search: [ local ]

oem-setup: false
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
prompt-install: true

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - initramfs
      - bootloader
      - umount
  - show:
      - finished

branding: kelpie
