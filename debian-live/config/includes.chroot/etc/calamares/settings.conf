# Kelpie OS Linux V3 — Calamares installer configuration
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
prompt-install: true

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - sources-media
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - packages
      - luksbootkeyfile
      - plymouthcfg
      - initramfscfg
      - initramfs
      - sources-media-unmount
      - sources-final
      - umount
  - show:
      - finished

branding: kelpie
